# Development stack: API + PostGIS + GeoServer + Metabase
services:
  db:
    # Main PostGIS database used by the API
    image: kartoza/postgis:15-3.3
    container_name: agora-dev-db-kartoza
    volumes:
      - agora-dev-db-data:/var/lib/postgresql
    ports:
      - 5434:5432 # Map host port 5434 to container port 5432
    environment:
      - POSTGRES_DB=${DATABASE_NAME}
      - POSTGRES_USER=${DATABASE_USERNAME}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - FORCE_SSL=FALSE
    restart: on-failure
    networks:
      - agora_network

  api:
    # FastAPI service (live reload enabled for development)
    image: agora-api-image:geoserver_proxy
    container_name: agora-dev-api
    depends_on:
      - db
    command: |
      bash -c '
      cd /src &&
      # Wait for database before starting API
      while !</dev/tcp/db/5432; do sleep 1; done &&
      poetry config virtualenvs.create false &&
      uvicorn app.main:app --reload --workers 1 --host 0.0.0.0 --port 8000'
    volumes:
      - ./src:/src
    environment:
      - WORKING_DIR=/src
    ports:
      - 8002:8000
    networks:
      - agora_network
  geoserver:
    # GeoServer for map publishing and spatial layers
    # build: ./geoserver
    image: agora-geoserver:2.27.6
    container_name: agora-geoserver-dev-container
    environment:
      - GEOSERVER_ADMIN_USER=${GEOSERVER_ADMIN_USER}
      - GEOSERVER_ADMIN_PASSWORD=${GEOSERVER_ADMIN_PASSWORD}
    volumes:
      # Persistent GeoServer data directory
      - agora-geoserver-data-dev:/geoserver_data/data
      # Local host paths for development datasets
      - /home/ortak/Desktop/sandbox/tosca-geoserver-postgis-test/docker-geoserver/geo-data:/mnt/data
      - /home/ortak/Desktop/HCU/LIG/data:/mnt/LIG
    ports:
      - ${GEOSERVER_PORT}:8080
    networks:
      - agora_network

  metabase:
    image: metabase/metabase:v0.63.5
    container_name: metabase
    ports:
      - "3001:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5433
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD}
      MB_DB_HOST: metabase_db
    networks:
      - agora_network
    restart: unless-stopped
    depends_on:
      - metabase_db
  metabase_db:
    # Separate Postgres database for Metabase metadata
    image: postgres:15
    container_name: metabase_db
    expose:
      - 5433
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${METABASE_DB_PASSWORD}
    volumes:
      - metabase_db_data:/var/lib/postgresql/data
    networks:
      - agora_network
    command: ["-p", "5433"]
    restart: unless-stopped



networks:
  agora_network:
    # Shared bridge network for all containers
    driver: bridge

volumes:
  # Named volumes to persist service data between restarts
  agora-dev-db-data:
  agora-geoserver-data-dev:
  metabase_db_data:
